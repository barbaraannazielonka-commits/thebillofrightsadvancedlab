<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bill of Rights: Advanced Lab</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--tx:#1b2232;--mu:#596175;--ac:#7a2e3a;--acs:#f4e4e6;--ok:#1b7a43;--oks:#e0f4e8;--no:#b3261e;--nos:#fbe5e3;--bd:#d8d3c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181f;--card:#1e222c;--tx:#eef0f5;--mu:#a4abbb;--ac:#e0909c;--acs:#3a2429;--ok:#6fd39a;--oks:#173a29;--no:#ff8f86;--nos:#43201e;--bd:#343b4b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181f;--card:#1e222c;--tx:#eef0f5;--mu:#a4abbb;--ac:#e0909c;--acs:#3a2429;--ok:#6fd39a;--oks:#173a29;--no:#ff8f86;--nos:#43201e;--bd:#343b4b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 Georgia,"Times New Roman",serif}
main{max-width:800px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:1.9rem;margin:.3em 0}h2{font-size:1.2rem;margin:.2em 0 .5em}
.sans,button,input,textarea,select{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:14px 0}
.tag{display:inline-block;font:600 .75rem system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);background:var(--acs);padding:3px 9px;border-radius:99px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
button{font-size:.95rem;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px;cursor:pointer}
.nav button{border-radius:99px;padding:6px 12px}.nav .cur,button.main{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button:hover{border-color:var(--ac)}
.mu{color:var(--mu);font-size:.9rem}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 4px}
.chip{font:.78rem system-ui,sans-serif;border:1px solid var(--bd);border-radius:99px;padding:2px 9px;color:var(--mu)}.chip.u{background:var(--oks);border-color:var(--ok);color:var(--ok);font-weight:600}
label{display:block;font-weight:600;margin:14px 0 4px}
textarea,input[type=text],select{width:100%;font-size:1rem;padding:10px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
textarea{min-height:140px;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}.row select{width:auto;min-width:190px}
.wc{font:.82rem system-ui,sans-serif;color:var(--mu);margin-top:3px}.wc.ok{color:var(--ok);font-weight:600}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;border-left:6px solid var(--ok);background:var(--oks)}
.g{color:var(--ok)}.b{color:var(--no)}
.cbs{display:flex;flex-wrap:wrap;gap:6px}.cb{display:inline-flex;align-items:center;gap:5px;margin:0;font-weight:400;border:2px solid var(--bd);border-radius:8px;padding:4px 10px}
.cb input{width:auto}.lr{display:flex;justify-content:space-between;gap:10px;font:.85rem system-ui,sans-serif;color:var(--mu)}
input[type=range]{width:100%}
.law{border-left:5px solid var(--ac);background:var(--acs);padding:10px 14px;border-radius:8px}
.foot{display:flex;justify-content:space-between;margin-top:22px}
@media print{.nav,.foot,.chips,button{display:none}}
</style></head><body><main>
<div id="top"></div><div id="app"></div>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"),wc=s=>(String(s).match(/\S+/g)||[]).length;
const NUM=["I","II","III","IV","V","VI","VII","VIII","IX","X"];
const AM=["Religion, speech, press, assembly and petition.","The right to keep and bear arms, linked to a militia.","No forced housing of soldiers in private homes in peacetime.","No unreasonable searches or seizures; warrants need probable cause.","Grand jury, no double jeopardy, no self-incrimination, due process, fair payment for seized property.","A speedy, public, impartial jury trial; a lawyer; the right to confront witnesses.","Jury trial in many civil cases.","No excessive bail or fines; no cruel and unusual punishment.","Listing some rights does not cancel others.","Powers not given to the federal government stay with the states or the people."];
const VOC=["infringe","ratify","safeguard","precedent","arguably","whereas","consequently","undermine","liberty","due process","proportionate","tension"];
const S={step:0,R:{},chk:{},t0:Date.now()},FL={};
function save(){try{localStorage.setItem("boradv",JSON.stringify({R:S.R,chk:S.chk,step:S.step}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem("boradv")||"null");if(d)Object.assign(S,d)}catch(e){}
const txt=()=>Object.values(S.R).filter(v=>typeof v=="string").join(" ").toLowerCase(),used=()=>VOC.filter(w=>txt().includes(w));
function F(id,label,min,hint){FL[id]=label;const v=S.R[id]||"",n=wc(v);return `<div><label for="${id}">${label}</label>${hint?`<div class="mu sans">${hint}</div>`:""}<textarea id="${id}" oninput="inp(this,${min})">${esc(v)}</textarea><div class="wc ${n>=min?"ok":""}" id="w_${id}">${n} words · aim for ${min}+</div></div>`}
function inp(e,m){S.R[e.id]=e.value;const n=wc(e.value),w=$("#w_"+e.id);w.textContent=n+" words · aim for "+m+"+";w.className="wc "+(n>=m?"ok":"");save();upd()}
function upd(){const u=used();$("#vw").innerHTML=VOC.map(w=>`<span class="chip ${u.includes(w)?"u":""}">${w}</span>`).join("");$("#voc").textContent=u.length+" / "+VOC.length;$("#clk").textContent=Math.floor((Date.now()-S.t0)/60000)+" min of 90"}
const SC=[["Police read a man’s phone messages without a warrant.",3],["A court orders a homeowner to house soldiers in peacetime.",2],["A suspect refuses to answer questions that could prove his own guilt.",4],["A defendant waits three years in jail with no trial and no lawyer.",5],["A farmer demands a jury in a civil dispute over money.",6],["A judge sets bail so high that nobody could pay it.",7],["A citizen claims a right that is not listed in the first ten amendments.",8],["A state argues that Congress has no power over a purely local matter.",9],["Students print a magazine that criticises the mayor.",0],["A resident argues that a new law limits his right to own a firearm.",1]];
const TN=[["Press freedom vs a fair trial (I and VI)","Newspapers may publish anything they know","Publication is limited until the trial ends"],["Privacy vs investigating serious crime (IV)","Police always need a warrant","Police may search when they suspect danger"],["The right to silence vs the search for truth (V)","A suspect never has to speak","Suspects should be expected to explain"]];
const CS=[{n:"The Passcode",t:"During a protest outside city hall, police arrest a 19-year-old protester. They take her phone and demand her passcode to read her messages. They have no warrant. She refuses.",a:[0,3,4]},{n:"Trial by Headline",t:"Two weeks before a trial, a local news site publishes a suspect’s alleged confession and his earlier charges. His lawyer asks the court to move the trial or limit reporting.",a:[0,5]},{n:"The Fine",t:"A city seizes a family’s van, worth $12,000, after a driver was found with a minor illegal item. It then demands $30,000 in fines.",a:[4,7]}];
const H=(tag,title,m,body)=>`<span class="tag">${tag}</span><h1>${title}</h1>${m?`<div class="mu sans">Suggested time: ${m} minutes</div>`:""}${body}`;
function s0(){return H("Briefing","The Bill of Rights: Advanced Lab",0,`<p>This 90-minute lab goes beyond the First and Second Amendments. You will work with all ten amendments of the Bill of Rights, test them against hard cases, compare them with another legal tradition and draft an amendment of your own. Write in precise, formal English: your vocabulary tracker (top of page) counts the academic words you use.</p>
<div class="card sans"><b>Your plan</b><ol>${ST.slice(1).filter(s=>s.m).map(s=>`<li>${s.t} – ${s.m} min</li>`).join("")}</ol></div>
<div class="card"><b>Your name</b><input type="text" id="nm" value="${esc(S.R.name||"")}" oninput="S.R.name=this.value;save()" placeholder="Type your name"></div>
<details class="card"><summary><b>The ten at a glance</b> (study summaries, open any time)</summary>${AM.map((a,i)=>`<p><b>${NUM[i]}.</b> ${a}</p>`).join("")}</details>
<p class="mu sans">Your answers are saved in this browser as you type. Use the numbered buttons to move between tasks.</p>`)}
function s1(){const c=S.chk.m;let ok=0;const rows=SC.map((q,i)=>{const v=S.R["m"+i],g=v===q[1];if(g)ok++;return `<div class="card"><div>${i+1}. ${q[0]}</div><div class="row"><select onchange="S.R['m${i}']=this.value===''?undefined:+this.value;save()"><option value="">Which amendment?</option>${NUM.map((n,k)=>`<option value="${k}" ${v===k?"selected":""}>${n}</option>`).join("")}</select>${c?`<b class="${g?"g":"b"}">${g?"✓":"✗ Correct: "+NUM[q[1]]}</b>`:""}</div></div>`}).join("");
return H("Task 1","Decode the ten",10,`<p>Match each situation to the amendment that protects it most directly. Try it without the summary first.</p>${rows}<div class="row"><button class="main" onclick="S.chk.m=1;go(1,1)">Check my answers</button></div>${c?`<div class="fb sans"><b>Score: ${ok} / 10</b></div>`:""}${F("m_gap","Look at any item you missed, or the one you found hardest. Explain in two or three sentences what you confused and how the amendments differ.",50)}`)}
function s2(){return H("Task 2","Why a list of rights?",15,`<div class="law">In 1787–88 the proposed Constitution had no list of individual rights. Anti-Federalists, who feared a strong central government, demanded one. Some Federalists, including Alexander Hamilton in Federalist No. 84, argued that a list was unnecessary and even risky, because it might suggest the government held powers it was never given. James Madison proposed amendments in Congress in 1789, and ten were ratified in 1791.<br><span class="mu">This is a short study summary. You will check it in Part B.</span></div>
${F("h_a","A. Explain why the Anti-Federalists wanted a bill of rights while some Federalists opposed one. Then say which side you find more persuasive, and why.",90,"Use a contrast word such as <i>whereas</i> and at least one word from the tracker.")}
${F("h_b","B. Source check. Consult one primary source (for example the text of the amendments or the Federalist Papers). Name it, and say whether it confirms or corrects one claim in the summary above.",40,"Do not copy long passages. Paraphrase.")}
${F("h_c","C. The Ninth and Tenth Amendments respond to the fear of a list. Explain how each one does this. Then judge: do they work in practice? Give a reason.",80)}`)}
function s3(){const sl=TN.map((q,i)=>`<div class="card"><b>${q[0]}</b><div class="lr"><span>${q[1]}</span><span>${q[2]}</span></div><input type="range" min="0" max="100" value="${S.R["s"+i]??50}" oninput="S.R['s${i}']=+this.value;save()"></div>`).join("");
return H("Task 3","The tension map",15,`<p>Rights often collide with each other or with public safety. Move each slider to show where <i>you</i> think the balance should sit. There is no correct position, but you must be able to defend yours.</p>${sl}
${F("t_a","Choose the pair that was hardest. Explain where you put your slider and why. Which amendment is <i>arguably</i> weaker in that conflict?",90)}
${F("t_b","Write the best argument against your own position in this pair. Then say whether it changes your view, and what evidence would make you move your slider.",70,"This is steelmanning: present the other side at its strongest.")}`)}
function cb(i,k,on){const a=new Set(S.R["c"+i]||[]);on?a.add(k):a.delete(k);S.R["c"+i]=[...a];save()}
function s4(){return H("Task 4","Case lab",20,`<p>Real disputes involve several amendments at once. For each case, tick every amendment you think is relevant, check your list, then argue both sides.</p>`+CS.map((c,i)=>{const sel=S.R["c"+i]||[];return `<div class="card"><h2>Case ${i+1}: ${c.n}</h2><p>${c.t}</p><div class="cbs sans">${NUM.map((n,k)=>`<label class="cb"><input type="checkbox" ${sel.includes(k)?"checked":""} onchange="cb(${i},${k},this.checked)">${n}</label>`).join("")}</div><div class="row"><button onclick="S.chk['c${i}']=1;go(4,1)">Check my list</button></div>${S.chk["c"+i]?`<div class="fb sans">Amendments most likely discussed: <b>${c.a.map(k=>NUM[k]).join(", ")}</b>. Real courts sometimes disagree on cases like this, so your reasoning matters more than a perfect match.</div>`:""}${F("c"+i+"_arg","Give the strongest argument for the individual, then the strongest argument for the government (3–4 sentences each).",90)}</div>`}).join("")+F("c_ref","Which case was hardest, and why? Which amendment was hardest to apply, and what extra information would a judge need?",60))}
function s5(){return H("Task 5","Beyond borders",12,`<div class="law">As a general picture: US law protects most offensive speech unless it falls into narrow categories such as true threats or incitement to imminent lawless action. Norway’s constitution also protects freedom of expression, but, as far as I know, Norwegian criminal law forbids some hateful statements about groups. Treat this as a starting point and verify the details yourself.</div>
${F("b_a","A. Find a reliable source on one difference between how the US and Norway handle speech. State the difference and name your source.",50)}
${F("b_b","B. Should a democracy tolerate speech that attacks groups of people? Present two serious views, then argue your own position and respond to the strongest objection.",140,"Aim for a clear thesis, two paragraphs of reasoning and a short conclusion.")}`)}
const CK=["Formal, precise language","Says who is protected or restricted","Includes at least one limit or exception","Connects to an existing amendment","Anticipates an objection"];
function ck(k,on){const a=new Set(S.R.ck||[]);on?a.add(k):a.delete(k);S.R.ck=[...a];save()}
function s6(){const sel=S.R.ck||[];return H("Task 6","Draft an amendment",10,`<p>Imagine the Bill of Rights were updated for a digital age. Draft an Amendment XI in formal legal language, then defend it.</p>
${F("a_t","Amendment XI: write the text (2–4 sentences).",40,"Legal drafting is precise. Avoid vague words.")}
${F("a_r","Rationale: what problem does it solve, and which existing amendment does it extend or limit?",70)}
${F("a_o","A sceptical senator objects. Write her strongest objection and your reply.",80)}
<div class="card sans"><b>Self-check</b>${CK.map((c,k)=>`<label class="cb" style="margin:4px 0"><input type="checkbox" ${sel.includes(k)?"checked":""} onchange="ck(${k},this.checked)">${c}</label>`).join("")}</div>`)}
function s7(){const tot=Object.values(S.R).filter(v=>typeof v=="string"&&v!==S.R.name).reduce((a,v)=>a+wc(v),0),ex="BILL OF RIGHTS: ADVANCED LAB\nName: "+(S.R.name||"")+"\n\n"+Object.keys(S.R).filter(k=>typeof S.R[k]=="string"&&k!="name").map(k=>"["+(FL[k]||k)+"]\n"+S.R[k]).join("\n\n");
return H("Task 7","Reflect and submit",5,`${F("r_a","Which task stretched your thinking most, and why?",50)}${F("r_b","Which amendment do you now understand differently? What changed your mind?",50)}${F("r_c","What is one question about rights that this lab did not answer, and how would you investigate it?",40)}
<div class="card sans"><b>Your summary</b><br>Words written: <b>${tot}</b> · Academic words used: <b>${used().length} / ${VOC.length}</b> · Task 1 score: <b>${SC.filter((q,i)=>S.R["m"+i]===q[1]).length} / 10</b></div>
<textarea id="ex" readonly style="min-height:200px">${esc(ex)}</textarea><div class="row"><button class="main" onclick="$('#ex').select();try{document.execCommand('copy')}catch(e){}">Copy my work</button><button onclick="window.print()">Print or save as PDF</button></div>`)}
const RF=[["National Archives: The Bill of Rights, a transcription","https://www.archives.gov/founding-docs/bill-of-rights-transcript","The full text of the amendments, transcribed from the 1789 resolution that Congress sent to the states. Interesting detail: Congress proposed twelve amendments then, not ten.","Use it for the source check in Task 2B. Compare its wording with the study summary in this lab."],
["National Constitution Center: Interactive Constitution","https://constitutioncenter.org/interactive-constitution","A nonpartisan site where, for each amendment, two scholars from different legal perspectives write a joint statement of what they agree on, and then separate statements where they disagree.","Choose the amendment from your tension map (Task 3) and read where the scholars disagree. Does it change where you put your slider?"],
["Oyez","https://www.oyez.org","A free archive from Chicago-Kent College of Law with summaries of Supreme Court cases and recordings of oral arguments.","Search for a case that interests you and, where audio is available, listen to the justices questioning a lawyer. What makes a question hard to answer?"],
["Teaching American History: Federalist No. 84","https://teachingamericanhistory.org/document/federalist-no-84/","Hamilton’s 1788 essay arguing against adding a bill of rights, with an editor’s introduction.","Read how Hamilton builds his argument, then compare his reasoning with your answer in Task 2A."],
["Library of Congress: Creating the Bill of Rights (legacy)","https://loc.gov/exhibits/creating-the-united-states/bill-of-rights-legacy.html","Documents and cartoons showing how the rights were used and contested after 1791, including the Miranda rights, Franklin Roosevelt’s Four Freedoms and a cartoon about the right to privacy.","Choose one item and decide which amendment it connects to. Is the issue still debated today?"],
["The Storting: The Norwegian Constitution","https://www.stortinget.no/en/In-English/About-the-Storting/The-constitution/","The Norwegian parliament’s English page about the constitution of 1814, which it describes as the second oldest written constitution still in existence.","Find the English text of the constitution and look up the article on freedom of expression. How does its wording compare with the First Amendment? English translations are provided for information; the Norwegian version prevails."]];
function s8(){return H("Extra","Further reading",0,`<p>Six websites to explore after the lab. Each one connects to a task you completed. Pages can move, so if a link does not work, search for the name of the site.</p>${RF.map((r,i)=>`<div class="card"><h2>${i+1}. <a href="${r[1]}" target="_blank" rel="noopener noreferrer" style="color:var(--ac)">${r[0]}</a></h2><div class="mu sans">${r[1].replace("https://","")}</div><p>${r[2]}</p><p><b>Try this:</b> ${r[3]}</p></div>`).join("")}${F("f_src","Optional: choose one site. In 3–4 sentences, explain what it adds to what you learned and how far you would trust it as a source, and why.",50,"Think about who runs the site and whether it is a primary source or a teaching resource.")}`)}
const ST=[{t:"Briefing",m:3,f:s0},{t:"Decode the ten",m:10,f:s1},{t:"Why a list?",m:15,f:s2},{t:"Tension map",m:15,f:s3},{t:"Case lab",m:20,f:s4},{t:"Beyond borders",m:12,f:s5},{t:"Draft an amendment",m:10,f:s6},{t:"Reflect and submit",m:5,f:s7},{t:"Further reading",m:0,f:s8}];
function go(i,keep){const y=window.scrollY;S.step=i;save();draw();if(keep)window.scrollTo(0,y)}
function draw(){$("#top").innerHTML=`<div class="nav sans">${ST.map((s,i)=>`<button class="${i==S.step?"cur":""}" title="${s.t}" onclick="go(${i})">${i==0?"Start":i}</button>`).join("")}</div><div class="mu sans">⏱ <span id="clk"></span> · Vocabulary <span id="voc"></span></div><div class="chips" id="vw"></div>`;
$("#app").innerHTML=ST[S.step].f()+`<div class="foot">${S.step==0?"<span></span>":`<button onclick="go(${S.step-1})">← Back</button>`}${S.step==ST.length-1?"<span></span>":`<button class="main" onclick="go(${S.step+1})">Next →</button>`}</div><footer class="mu sans" style="text-align:center;margin-top:30px">Nannestad High School – Barbara Anna Zielonka</footer>`;upd();window.scrollTo(0,0)}
draw();setInterval(upd,20000);
</script></body></html>
